<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/witness_app_icon.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="%sveltekit.assets%/witness_app_icon.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Witness — Web Security Testing</title>
    <style>
      html, body { margin: 0; background: #232323; }
      #witness-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #232323;
      }
      #witness-boot-splash img {
        display: block;
        width: 112px;
        height: 112px;
        object-fit: contain;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="witness-boot-splash" role="status" aria-label="Loading Witness">
      <img src="%sveltekit.assets%/witness_app_icon.png" alt="" />
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
